
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: freshharvest-supermarket-pos
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
      - PORT=80
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - freshharvest-net

networks:
  freshharvest-net:
    driver: bridge
